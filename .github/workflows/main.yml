name: Build-Windows

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: Client/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install -r Client/requirements.txt --ignore-requires-python

      - name: Build executable
        uses: Nuitka/Nuitka-Action@v1.3
        with:
          working-directory: ./Client
          script-name: ./Mini-KVM.py
          mode: app
          enable-plugins: pyside6
          windows-console-mode: disable
          windows-icon-from-ico: ./icons/icon.ico
          include-data-dir: |
            ./icons=icons
            ./web=web
            ./web_s=web_s
            ./Data=data
          include-data-files: |
            ./trans_cn.qm=trans_cn.qm
            ./qtbase_cn.qm=qtbase_cn.qm
          include-qt-plugins: multimedia

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Mini-KVM-Windows-x64
          path: Client/build/Mini-KVM.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Mini-KVM-Windows-x64
          path: release

      - name: Check latest commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=build-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.commit.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.commit.outputs.tag }}
          name: Windows build ${{ steps.commit.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: release/Mini-KVM.exe
